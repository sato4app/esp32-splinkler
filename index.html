<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d91">
  <meta name="description" content="ESP32-C3からBluetooth経由でSplinklerを制御する">
  <title>ESP32 Splinkler</title>

  <!-- PWA（GitHub Pagesのプロジェクトページでも動くよう相対パス） -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root {
      --theme: #0b3d91;
      --bg: #f4f6fa;
      --fg: #1b1f24;
      --sub: #5b6472;
      --border: #c9d2e3;
      --ok: #1a7f37;
      --error: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: var(--theme);
      color: #fff;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    header h1 { font-size: 18px; margin: 0; }
    #status {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      white-space: nowrap;
    }
    #status.connected { background: var(--ok); }
    main { padding: 16px; max-width: 720px; margin: 0 auto; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    button {
      flex: 1 1 auto;
      min-height: 48px;
      min-width: 120px;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid var(--theme);
      border-radius: 8px;
      background: var(--theme);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #fff; color: var(--theme); }
    button:disabled { background: #dfe3ea; border-color: var(--border); color: #8a8f98; cursor: default; }
    .card {
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    fieldset { border: 0; margin: 0 0 16px; padding: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: bold; color: var(--sub); }
    .count-input {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }
    /* 日・分・秒のように単位つきで横に並べる入力欄 */
    .units { display: flex; flex-wrap: wrap; gap: 8px; }
    .units label { display: flex; align-items: center; gap: 4px; font-size: 16px; }
    input[type="number"] {
      width: 96px;
      min-height: 48px;
      padding: 12px;
      font-size: 18px;
      text-align: right;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }
    .units input[type="number"] { width: 72px; padding: 8px; }
    /* 秒まで見える幅を確保し、足りない画面ではセットボタンを下の行に回す */
    input[type="datetime-local"] {
      flex: 3 1 230px;
      min-width: 0;
      min-height: 48px;
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--fg);
    }
    #setBtn { flex: 1 0 auto; min-width: 96px; }
    .error { margin: 0 0 12px; font-size: 14px; color: var(--error); }
    .big-status { font-size: 20px; font-weight: bold; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
    #progressText.active { color: var(--theme); }
    #scheduleStatus.running { color: var(--ok); }
    progress { width: 100%; height: 12px; accent-color: var(--theme); }
    .hint { font-size: 13px; color: var(--sub); margin: 8px 0 0; }
    #runList { list-style: none; margin: 12px 0 0; padding: 0; }
    #runList li {
      display: grid;
      grid-template-columns: 2.8em 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 10px 4px;
      border-top: 1px solid var(--border);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    #runList li.done { color: var(--sub); }
    #runList li.next { background: #eef3fc; }
    #runList li.running { background: #e6f4ea; font-weight: bold; }
    .run-no { color: var(--sub); }
    .run-time span { white-space: nowrap; }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--sub);
      white-space: nowrap;
    }
    li.next .badge { border-color: var(--theme); color: var(--theme); }
    li.running .badge { border-color: var(--ok); background: var(--ok); color: #fff; }
    #log {
      width: 100%;
      height: 30vh;
      min-height: 140px;
      padding: 8px;
      font-size: 14px;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      resize: vertical;
    }
    #notice {
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      background: #fff4e5;
      border: 1px solid #f0b429;
      font-size: 14px;
      line-height: 1.6;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>ESP32 Splinkler</h1>
    <span id="status">未接続</span>
  </header>

  <main>
    <p id="notice" hidden></p>

    <div class="row">
      <button id="connectBtn">ESP32に接続</button>
      <button id="disconnectBtn" class="secondary" disabled>切断</button>
      <button id="installBtn" class="secondary" hidden>ホーム画面に追加</button>
    </div>

    <section class="card">
      <h2>動作設定</h2>
      <fieldset>
        <legend>間隔</legend>
        <div class="units">
          <label><input type="number" id="intervalDays" min="0" max="365" step="1" value="1" inputmode="numeric">日</label>
          <label><input type="number" id="intervalMinutes" min="0" max="1439" step="1" value="0" inputmode="numeric">分</label>
          <label><input type="number" id="intervalSeconds" min="0" max="59" step="1" value="0" inputmode="numeric">秒</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>動作時間</legend>
        <div class="units">
          <label><input type="number" id="durationMinutes" min="0" max="1439" step="1" value="10" inputmode="numeric">分</label>
          <label><input type="number" id="durationSeconds" min="0" max="59" step="1" value="0" inputmode="numeric">秒</label>
        </div>
      </fieldset>
      <fieldset>
        <legend>回数</legend>
        <label class="count-input">
          <input type="number" id="repeatCount" min="1" max="100" step="1" value="7" inputmode="numeric">
          回
        </label>
      </fieldset>
      <fieldset>
        <legend>開始日時</legend>
        <div class="row">
          <input type="datetime-local" id="startAt" step="1">
          <button id="setBtn" class="secondary">セット</button>
        </div>
      </fieldset>
      <p id="scheduleError" class="error" role="alert" hidden></p>
      <div class="row">
        <button id="startBtn">スタート</button>
        <button id="clearBtn" class="secondary" disabled>クリア</button>
      </div>
      <p class="hint">「セット」で現在時刻＋間隔を開始日時にします（手で変更も可）。
        「スタート」で開始日時から間隔ごとに、回数分の動作予定を作成します。</p>
    </section>

    <section class="card">
      <h2>動作予定</h2>
      <p id="scheduleStatus" class="big-status">予定なし</p>
      <p id="scheduleSummary" class="hint"></p>
      <ol id="runList"></ol>
      <p class="hint">回路が未完成のため、ESP32へは送信せず、この画面上で予定どおりに進行を表示します。
        予定はページを閉じても保存されます。</p>
    </section>

    <section class="card">
      <h2>接続テスト（LED点滅）</h2>
      <div class="row">
        <label class="count-input">
          <input type="number" id="blinkCount" min="1" max="100" step="1" value="5" inputmode="numeric" enterkeyhint="go">
          回
        </label>
      </div>
      <div class="row">
        <button id="blinkBtn" disabled>点滅開始</button>
        <button id="stopBtn" class="secondary" disabled>停止</button>
      </div>
      <p id="progressText" class="big-status">—</p>
      <progress id="progressBar" max="1" value="0"></progress>
      <p class="hint">内蔵LEDを1秒点灯・1秒消灯で、指定回数（1〜100回）点滅します。</p>
    </section>

    <textarea id="log" readonly></textarea>
  </main>

  <script>
    // ESP32側のコードと合わせたUUID
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Webからの書込先
    const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Webでの受取先
    const DEVICE_NAME = "ESP32-Splinkler"; // ESP32側の DEVICE_NAME と合わせる
    const MAX_BLINK_COUNT = 100;           // ESP32側の MAX_BLINK_COUNT と合わせる

    let bluetoothDevice;
    let rxCharacteristic; // 送信用

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const installBtn = document.getElementById('installBtn');
    const blinkCount = document.getElementById('blinkCount');
    const blinkBtn = document.getElementById('blinkBtn');
    const stopBtn = document.getElementById('stopBtn');
    const progressText = document.getElementById('progressText');
    const progressBar = document.getElementById('progressBar');
    const logArea = document.getElementById('log');
    const statusEl = document.getElementById('status');
    const notice = document.getElementById('notice');

    function log(message) {
      const time = new Date().toLocaleTimeString('ja-JP', { hour12: false });
      logArea.value += '[' + time + '] ' + message + '\n';
      logArea.scrollTop = logArea.scrollHeight;
    }

    // 接続状態に応じてUIをまとめて切り替える
    function setConnected(connected) {
      statusEl.textContent = connected ? '接続中' : '未接続';
      statusEl.classList.toggle('connected', connected);
      connectBtn.disabled = connected;
      disconnectBtn.disabled = !connected;
      blinkBtn.disabled = !connected;
      stopBtn.disabled = !connected;
      setProgress(connected ? '待機中' : '—', 0, 1, false);
    }

    function setProgress(text, value, max, active) {
      progressText.textContent = text;
      progressText.classList.toggle('active', active);
      progressBar.max = max;
      progressBar.value = value;
    }

    function showNotice(html) {
      notice.innerHTML = html;
      notice.hidden = false;
    }

    // Web Bluetoothが使える環境かを起動時に判定する
    function checkEnvironment() {
      if (!window.isSecureContext) {
        showNotice('このページは <b>HTTPS または localhost</b> で開く必要があります。'
          + 'Web Bluetooth APIは安全なコンテキストでのみ動作します。');
        connectBtn.disabled = true;
        return;
      }
      if (!navigator.bluetooth) {
        showNotice('このブラウザは <b>Web Bluetooth API</b> に対応していません。'
          + 'Android版Chrome、またはデスクトップ版のChrome/Edgeで開いてください'
          + '（iOSのSafari・Firefoxは非対応）。');
        connectBtn.disabled = true;
      }
    }

    // ESP32からの通知を表示に反映する
    //   ON <n>/<回数>  n回目の点灯
    //   DONE <回数>    指定回数の点滅が完了
    //   STOPPED        停止コマンドで停止
    //   ERR <内容>     コマンドの誤り
    function handleMessage(message) {
      const text = message.trim();
      const space = text.indexOf(' ');
      const type = space < 0 ? text : text.slice(0, space);
      const arg = space < 0 ? '' : text.slice(space + 1);
      switch (type) {
        case 'ON': {
          const [current, total] = arg.split('/').map(Number);
          setProgress(`点滅中 ${current} / ${total} 回目`, current, total, true);
          break;
        }
        case 'DONE':
          setProgress(`完了（${arg}回）`, 1, 1, false);
          break;
        case 'STOPPED':
          setProgress('停止しました', 0, 1, false);
          break;
        case 'ERR':
          log('ESP32でエラー: ' + arg);
          break;
      }
    }

    connectBtn.addEventListener('click', async () => {
      try {
        log('デバイスを検索中...');
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: DEVICE_NAME }],
          optionalServices: [SERVICE_UUID]
        });

        // 切断検知はデバイスごとに一度だけ登録する（再接続時の二重登録を避ける）
        bluetoothDevice.addEventListener('gattserverdisconnected', () => {
          log('❌ 切断されました');
          rxCharacteristic = null;
          setConnected(false);
        });

        log('接続しています...');
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        // 受信用（TX）のセットアップ
        const txCharacteristic = await service.getCharacteristic(TX_UUID);
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
          const value = new TextDecoder().decode(event.target.value);
          log('ESP32から受信: ' + value);
          handleMessage(value);
        });

        // 送信用（RX）のセットアップ
        rxCharacteristic = await service.getCharacteristic(RX_UUID);

        log('✅ 接続完了！');
        setConnected(true);

      } catch (error) {
        log('エラー: ' + error);
      }
    });

    disconnectBtn.addEventListener('click', () => {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      }
    });

    async function sendCommand(command) {
      if (!rxCharacteristic) return;
      try {
        await rxCharacteristic.writeValue(new TextEncoder().encode(command));
        log('Webから送信: ' + command);
      } catch (error) {
        log('送信エラー: ' + error);
      }
    }

    function startBlink() {
      const count = Number(blinkCount.value);
      if (!Number.isInteger(count) || count < 1 || count > MAX_BLINK_COUNT) {
        log(`回数は1〜${MAX_BLINK_COUNT}の整数で指定してください`);
        blinkCount.focus();
        return;
      }
      sendCommand('BLINK ' + count);
    }

    blinkBtn.addEventListener('click', startBlink);
    stopBtn.addEventListener('click', () => sendCommand('STOP'));
    // スマホのソフトキーボードの実行キーでも開始できるようにする
    blinkCount.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (!blinkBtn.disabled) startBlink();
      }
    });

    // ===== 動作スケジュール =====
    // n回目（0始まり）は「開始日時 + n × 間隔」に始まり、動作時間だけ動く。
    // 回路が未完成のため、現在はこの画面上で進行を表示するだけでESP32へは送らない。

    const SETTINGS_KEY = 'esp32-splinkler-settings';
    const SCHEDULE_KEY = 'esp32-splinkler-schedule';
    const RUN_STATE_LABELS = { waiting: '予定', next: '次回', running: '動作中', done: '完了' };

    const intervalDays = document.getElementById('intervalDays');
    const intervalMinutes = document.getElementById('intervalMinutes');
    const intervalSeconds = document.getElementById('intervalSeconds');
    const durationMinutes = document.getElementById('durationMinutes');
    const durationSeconds = document.getElementById('durationSeconds');
    const repeatCount = document.getElementById('repeatCount');
    const startAt = document.getElementById('startAt');
    const setBtn = document.getElementById('setBtn');
    const startBtn = document.getElementById('startBtn');
    const clearBtn = document.getElementById('clearBtn');
    const scheduleError = document.getElementById('scheduleError');
    const scheduleStatus = document.getElementById('scheduleStatus');
    const scheduleSummary = document.getElementById('scheduleSummary');
    const runList = document.getElementById('runList');
    const settingInputs = [intervalDays, intervalMinutes, intervalSeconds,
      durationMinutes, durationSeconds, repeatCount, startAt];

    let schedule = null;     // { start(ms), intervalSec, durationSec, repeat }
    let runs = [];           // 各回の { no, start, end, el, badge }
    let timerId = null;
    let lastPhaseKey = null; // 進行の変化をログに出すための前回の状態

    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
    const pad2 = (n) => String(n).padStart(2, '0');

    function formatTime(date) {
      return `${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}`;
    }

    // 例: 9/18(金) 14:30:00
    function formatDateTime(ms) {
      const d = new Date(ms);
      return `${d.getMonth() + 1}/${d.getDate()}(${WEEKDAYS[d.getDay()]}) ${formatTime(d)}`;
    }

    // datetime-local の value 形式（ローカル時刻）例: 2026-09-18T14:30:00
    function toInputValue(ms) {
      const d = new Date(ms);
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${formatTime(d)}`;
    }

    // 秒数を入力欄と同じ「日・分・秒」の単位で表す 例: 1日 30分
    function formatSpan(totalSec) {
      const days = Math.floor(totalSec / 86400);
      const minutes = Math.floor(totalSec % 86400 / 60);
      const seconds = totalSec % 60;
      const parts = [];
      if (days) parts.push(days + '日');
      if (minutes) parts.push(minutes + '分');
      if (seconds || parts.length === 0) parts.push(seconds + '秒');
      return parts.join(' ');
    }

    // 残り時間の表示 例: 1日 02:03:04
    function formatRemaining(ms) {
      const totalSec = Math.ceil(ms / 1000);
      const days = Math.floor(totalSec / 86400);
      const rest = totalSec % 86400;
      const hms = `${pad2(Math.floor(rest / 3600))}:${pad2(Math.floor(rest % 3600 / 60))}:${pad2(rest % 60)}`;
      return days > 0 ? `${days}日 ${hms}` : hms;
    }

    function storageGet(key) {
      try {
        return JSON.parse(localStorage.getItem(key));
      } catch {
        return null;
      }
    }

    // 保存できない環境（プライベートモード等）では保存せずに続ける
    function storageSet(key, value) {
      try {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // 何もしない
      }
    }

    function saveSettings() {
      const values = {};
      for (const input of settingInputs) values[input.id] = input.value;
      storageSet(SETTINGS_KEY, values);
    }

    function loadSettings() {
      const values = storageGet(SETTINGS_KEY);
      if (!values) return;
      for (const input of settingInputs) {
        if (typeof values[input.id] === 'string') input.value = values[input.id];
      }
    }

    // 入力の誤り（どの欄を直せばよいかを持たせる）
    class InputError extends Error {
      constructor(message, input) {
        super(message);
        this.input = input;
      }
    }

    function showError(error) {
      if (!(error instanceof InputError)) throw error;
      scheduleError.textContent = error.message;
      scheduleError.hidden = false;
      error.input.focus();
    }

    function clearError() {
      scheduleError.hidden = true;
    }

    // 入力欄を整数として読み取る（空欄は0とみなす）
    function readInt(input, label) {
      const value = Number(input.value);
      if (input.validity.badInput || !Number.isInteger(value)
        || value < Number(input.min) || value > Number(input.max)) {
        throw new InputError(`${label}は${input.min}〜${input.max}の整数で指定してください`, input);
      }
      return value;
    }

    function readInterval() {
      const sec = readInt(intervalDays, '間隔の日') * 86400
        + readInt(intervalMinutes, '間隔の分') * 60
        + readInt(intervalSeconds, '間隔の秒');
      if (sec === 0) throw new InputError('間隔は1秒以上にしてください', intervalSeconds);
      return sec;
    }

    function readSettings() {
      const intervalSec = readInterval();
      const durationSec = readInt(durationMinutes, '動作時間の分') * 60
        + readInt(durationSeconds, '動作時間の秒');
      if (durationSec === 0) throw new InputError('動作時間は1秒以上にしてください', durationSeconds);
      const repeat = readInt(repeatCount, '回数');
      // 前の動作が終わる前に次の動作が始まらないようにする
      if (repeat > 1 && durationSec >= intervalSec) {
        throw new InputError('動作時間は間隔より短くしてください', durationMinutes);
      }
      return { intervalSec, durationSec, repeat };
    }

    // 「セット」: 現在時刻＋間隔を開始日時にする
    function applySet(intervalSec) {
      const now = Math.floor(Date.now() / 1000) * 1000;
      startAt.value = toInputValue(now + intervalSec * 1000);
      saveSettings();
    }

    // 各回の開始・終了日時を一覧にする
    function renderRuns() {
      runList.replaceChildren();
      runs = [];
      if (!schedule) {
        scheduleSummary.textContent = '「スタート」を押すと、ここに動作予定が表示されます。';
        return;
      }
      for (let i = 0; i < schedule.repeat; i++) {
        const start = schedule.start + i * schedule.intervalSec * 1000;
        const end = start + schedule.durationSec * 1000;
        // 終了が開始と同じ日なら時刻だけにして一覧を読みやすくする
        const endText = new Date(start).toDateString() === new Date(end).toDateString()
          ? formatTime(new Date(end)) : formatDateTime(end);
        const li = document.createElement('li');
        li.innerHTML = `<span class="run-no">#${i + 1}</span>`
          + `<span class="run-time"><span>${formatDateTime(start)}</span> <span>〜 ${endText}</span></span>`
          + '<span class="badge"></span>';
        runList.appendChild(li);
        runs.push({ no: i + 1, start, end, el: li, badge: li.querySelector('.badge') });
      }
      scheduleSummary.textContent = `全${schedule.repeat}回 ／ 間隔 ${formatSpan(schedule.intervalSec)}`
        + ` ／ 動作 ${formatSpan(schedule.durationSec)} ／ 最終終了 ${formatDateTime(runs[runs.length - 1].end)}`;
    }

    // 現在が「次の回を待っている」「動作中」「全て完了」のどれか
    function currentPhase(now) {
      for (const run of runs) {
        if (now < run.start) return { type: 'wait', run };
        if (now < run.end) return { type: 'run', run };
      }
      return { type: 'done' };
    }

    function setScheduleStatus(text, running) {
      scheduleStatus.textContent = text;
      scheduleStatus.classList.toggle('running', running);
    }

    // 1秒ごとに呼ばれ、一覧の状態と残り時間を更新する
    function updateSchedule() {
      if (!schedule) return;
      const now = Date.now();
      const phase = currentPhase(now);

      for (const run of runs) {
        let state = 'waiting';
        if (now >= run.end) state = 'done';
        else if (now >= run.start) state = 'running';
        else if (run === phase.run) state = 'next';
        run.el.className = state;
        run.badge.textContent = RUN_STATE_LABELS[state];
      }

      if (phase.type === 'wait') {
        setScheduleStatus(`次回 #${phase.run.no} まで ${formatRemaining(phase.run.start - now)}`, false);
      } else if (phase.type === 'run') {
        setScheduleStatus(`動作中 #${phase.run.no} 残り ${formatRemaining(phase.run.end - now)}`, true);
      } else {
        setScheduleStatus(`全${runs.length}回 完了`, false);
        stopTimer();
      }

      // 画面を開いている間に進行が変わったらログに残す（開いた直後は記録しない）
      const phaseKey = phase.type === 'done' ? 'done' : phase.type + phase.run.no;
      if (lastPhaseKey !== null && phaseKey !== lastPhaseKey) {
        if (lastPhaseKey.startsWith('run')) log(`■ #${lastPhaseKey.slice(3)} 動作終了`);
        if (phase.type === 'run') log(`▶ #${phase.run.no} 動作開始`);
        if (phase.type === 'done') log(`全${runs.length}回の動作が完了しました`);
      }
      lastPhaseKey = phaseKey;
    }

    function startTimer() {
      if (timerId === null) timerId = setInterval(updateSchedule, 1000);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function setSchedule(newSchedule) {
      schedule = newSchedule;
      storageSet(SCHEDULE_KEY, schedule);
      renderRuns();
      lastPhaseKey = null;
      clearBtn.disabled = !schedule;
      stopTimer();
      if (schedule) {
        startTimer();
        updateSchedule(); // 全て完了済みならここでタイマーが止まる
      } else {
        setScheduleStatus('予定なし', false);
      }
    }

    function loadSchedule() {
      const saved = storageGet(SCHEDULE_KEY);
      if (saved && [saved.start, saved.intervalSec, saved.durationSec, saved.repeat].every(Number.isFinite)) {
        setSchedule(saved);
      } else {
        setSchedule(null);
      }
    }

    setBtn.addEventListener('click', () => {
      clearError();
      try {
        applySet(readInterval());
      } catch (error) {
        showError(error);
      }
    });

    // 「スタート」: 開始日時から間隔ごとに、回数分の動作日時を算出して一覧に出す
    startBtn.addEventListener('click', () => {
      clearError();
      try {
        const settings = readSettings();
        if (startAt.validity.badInput) throw new InputError('開始日時を最後まで入力してください', startAt);
        if (startAt.value === '') applySet(settings.intervalSec); // 未設定なら「セット」と同じにする
        const start = new Date(startAt.value).getTime();
        if (Number.isNaN(start)) throw new InputError('開始日時を正しく指定してください', startAt);
        if (start <= Date.now()) {
          throw new InputError('開始日時が過去です。「セット」で設定し直してください', startAt);
        }
        setSchedule({ start, ...settings });
        log(`動作予定を作成: ${formatDateTime(start)} から ${formatSpan(settings.intervalSec)}ごとに`
          + `${settings.repeat}回（各${formatSpan(settings.durationSec)}）`);
      } catch (error) {
        showError(error);
      }
    });

    clearBtn.addEventListener('click', () => {
      // 進行中の予定だけ誤操作を防ぐため確認する
      if (timerId !== null && !confirm('動作予定をクリアしますか？')) return;
      setSchedule(null);
      log('動作予定をクリアしました');
    });

    for (const input of settingInputs) {
      input.addEventListener('change', saveSettings);
    }

    // バックグラウンド中はタイマーが間引かれるため、表示に戻ったらすぐ更新する
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateSchedule();
    });

    // ホーム画面への追加（Androidのインストールプロンプト）
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      installBtn.hidden = true;
      log('ホーム画面に追加しました');
    });

    // Service Workerの登録（オフライン起動用）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .catch((error) => console.error('Service Workerの登録に失敗:', error));
      });
    }

    checkEnvironment();
    loadSettings();
    loadSchedule();
  </script>
</body>
</html>
